[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live_gemini: marks tests as requiring live Google Gemini API connectivity (deselect with '-m "not live_gemini"')
    postgres: marks integration tests requiring a running PostgreSQL instance with pgvector
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*httpx.*
    ignore:builtin type SwigPy.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning

